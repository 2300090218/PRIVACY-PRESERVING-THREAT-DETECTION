version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: threat_detection_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: threat_detection
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - threat_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  central-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: threat_detection_central_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/threat_detection
      - SECRET_KEY=${SECRET_KEY:-threat-detection-dev-secret-key-super-secure-32chars}
      - JWT_SECRET=${JWT_SECRET:-threat-detection-jwt-secret-dev-key-32chars}
      - PRIVACY_SALT=${PRIVACY_SALT:-privacy-salt-isolated-dev-token-hmac-salt}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - WEBSOCKET_URL=ws://central-api:8000/api/v1/ws/dashboard
      - OPERATIONAL_MODE=LIVE
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/datasets:/app/ml/datasets
    networks:
      - threat_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  local-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: threat_detection_local_agent
    restart: unless-stopped
    depends_on:
      central-api:
        condition: service_healthy
    environment:
      - CENTRAL_API_URL=http://central-api:8000
      - AGENT_ORGANIZATION_ID=org_enterprise_a
      - AGENT_AGENT_ID=agent-dmz-01
      - AGENT_AGENT_API_KEY=agent_key_enterprise_a_dmz_prod_secret
    networks:
      - threat_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: threat_detection_frontend
    restart: unless-stopped
    depends_on:
      - central-api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws/dashboard
    ports:
      - "3000:3000"
    networks:
      - threat_net

volumes:
  pgdata:

networks:
  threat_net:
    driver: bridge
