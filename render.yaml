services:
  - type: web
    name: privacy-threat-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PRIVACY_SALT
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://privacy-preserving-threat-detection.vercel.app"
      - key: ENABLE_SIMULATOR
        value: "true"
      - key: OPERATIONAL_MODE
        value: LIVE
